# Her push ve PR'da testleri GitHub'ın sunucusunda çalıştırır.
# Sonuç: repoda Actions sekmesi ve commit'lerin yanındaki ✔ / ✘.
name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # Actions sekmesinden elle de çalıştırılabilir

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen   # ekransız sunucuda Qt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt
      - name: Testleri çalıştır
        run: python -m pytest -q

  # Firmware'i iki kart (klasik ESP32, ESP32-S3) × iki core sürümüyle derler (kart gerekmez).
  # Sürümler firmware/esp32_pendulum/README.md ile aynı.
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ["3.3.12", "2.0.17"]
        board: ["esp32", "esp32s3"]
        end_sensors: [1, 2]   # uç sensörü: 1 tek sensör, 2 optik + mikro switch (#50 Aşama 4)
        mpu: [0]
        include:              # MPU6050 jiroskobu açık (#50 Aşama 5): S3 kartında iki core sürümüyle
          - {core: "3.3.12", board: "esp32s3", end_sensors: 2, mpu: 1}
          - {core: "2.0.17", board: "esp32s3", end_sensors: 2, mpu: 1}
          - {core: "3.3.12", board: "esp32", end_sensors: 1, mpu: 1}
          - {core: "2.0.17", board: "esp32", end_sensors: 1, mpu: 1}
    env:
      ESP32_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 kart paketi ve ArduinoJson'u kur
        run: |
          pip install pyserial   # core 2.x Linux'ta esptool.py için gerekli
          arduino-cli core update-index --additional-urls "$ESP32_URL"
          arduino-cli core install "esp32:esp32@${{ matrix.core }}" --additional-urls "$ESP32_URL"
          arduino-cli lib install ArduinoJson@7.4.3
      - name: Firmware'i derle
        run: >
          arduino-cli compile --fqbn esp32:esp32:${{ matrix.board }} --warnings all
          --build-property "compiler.cpp.extra_flags=-DEND_SENSORS=${{ matrix.end_sensors }} -DUSE_MPU6050=${{ matrix.mpu }}"
          firmware/esp32_pendulum
